# Render Blueprint: New + > Blueprint, then select this repo.
services:
  - type: web
    name: staffsync-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGO_URI        # paste your Atlas connection string in the Render dashboard
        sync: false
      - key: CLIENT_URL       # your frontend URL, e.g. https://staffsync.vercel.app
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
